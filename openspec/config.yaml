project: genchord
artifact_store:
  mode: hybrid
  local: openspec
  memory: engram

context:
  summary: "Herramienta web de estudio para explorar acompanamientos con acordes visuales y auditivos."
  product_doc: docs/product.md
  technical_direction_doc: docs/technical-direction.md
  ai_collaboration_doc: docs/ai-collaboration.md

architecture:
  boundaries:
    music_core: "Notas, escalas, grados, acordes, inversiones y voicings conceptuales; sin React, DOM ni audio."
    audio: "Convierte eventos musicales ya resueltos en sonido reproducible; sin reglas teoricas."
    ui: "Estado de estudio, teclado visual, controles y feedback; sin detalles internos de audio o teoria."

testing:
  strict_tdd: false
  app_code: true
  package_json: true
  test_runner: Vitest
  test_command: npm test
  lint_command: none
  typecheck_command: npm run typecheck
  reason: "App code and Vitest exist, but strict TDD is not currently configured as the project workflow."
